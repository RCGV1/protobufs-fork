syntax = "proto3";

package meshtastic;

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "StoreForwardArchiveProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * The over-the-mesh envelope for Store and Forward archive reconciliation.
 *
 * It is intentionally separate from StoreAndForward and StoreForwardPlusPlus:
 * those protocols have different on-air semantics and compatibility contracts.
 */
message StoreForwardSetReconciliation {
  /*
   * Wire-format version. Version 1 is the only version defined by this schema.
   */
  uint32 protocol_version = 1;

  /*
   * Canonical identifier for the Store and Forward radio plan.
   */
  bytes radio_plan_id = 2;

  /*
   * Canonical identifier for the requested archive scope.
   */
  bytes scope_id = 3;

  oneof body {
    /*
     * Signed primary-mesh binding for a Store and Forward service.
     */
    StoreForwardPeerBinding peer_binding = 10;

    /*
     * Request admission to a Store and Forward Catch-Up session.
     */
    StoreForwardCatchUpRequest catch_up_request = 20;

    /*
     * A request-bound reservation in the Catch-Up admission queue.
     */
    StoreForwardCatchUpWait catch_up_wait = 21;

    /*
     * An offer to retune and join a Catch-Up session.
     */
    StoreForwardCatchUpReady catch_up_ready = 22;

    /*
     * A terminal admission response.
     */
    StoreForwardCatchUpReject catch_up_reject = 23;

    /*
     * The first message transmitted after a client reaches the S&F mesh.
     */
    StoreForwardCatchUpJoin catch_up_join = 24;

    /*
     * The result of a Catch-Up join attempt.
     */
    StoreForwardCatchUpJoinResult catch_up_join_result = 25;

    /*
     * Cancel a queued, offered, or active Catch-Up session.
     */
    StoreForwardCatchUpCancel catch_up_cancel = 26;
  }
}

/*
 * Signed binding from the primary Store and Forward service to its Catch-Up
 * service endpoint. A zero archive_service_node_num and an empty
 * archive_service_public_key mean the primary service is also the archive
 * service, as on an embedded dual-radio node.
 */
message StoreForwardPeerBinding {
  /*
   * Node number of the primary-mesh Store and Forward service.
   */
  fixed32 primary_service_node_num = 1;

  /*
   * X25519 public key of the primary-mesh Store and Forward service.
   */
  bytes primary_service_public_key = 2;

  /*
   * Node number of the S&F-mesh service, or zero when it matches the primary service.
   */
  fixed32 archive_service_node_num = 3;

  /*
   * X25519 public key of the S&F-mesh service, or empty when it matches the primary service.
   */
  bytes archive_service_public_key = 4;

  /*
   * Random epoch that invalidates outstanding admission records on restart.
   */
  fixed64 admission_epoch = 5;
}

/*
 * Request a bounded Store and Forward Catch-Up admission.
 */
message StoreForwardCatchUpRequest {
  /*
   * Random request identifier generated by the requester.
   */
  bytes request_id = 1;

  /*
   * Whether the requester accepts a bounded waiting reservation.
   */
  bool wait_for_slot = 2;

  /*
   * Admission epoch from the selected service binding.
   */
  fixed64 admission_epoch = 3;
}

/*
 * A request-bound, time-limited admission reservation.
 */
message StoreForwardCatchUpWait {
  /*
   * Request identifier from StoreForwardCatchUpRequest.
   */
  bytes request_id = 1;

  /*
   * Admission epoch from the selected service binding.
   */
  fixed64 admission_epoch = 2;

  /*
   * Remaining reservation time in seconds.
   */
  uint32 lease_remaining_seconds = 3;
}

/*
 * Offer a Catch-Up session to an admitted requester.
 */
message StoreForwardCatchUpReady {
  /*
   * Request identifier from StoreForwardCatchUpRequest.
   */
  bytes request_id = 1;

  /*
   * Admission epoch from the selected service binding.
   */
  fixed64 admission_epoch = 2;

  /*
   * Monotonically increasing offer identifier for this request.
   */
  uint32 offer_generation = 3;

  /*
   * Random, single-session capability required by StoreForwardCatchUpJoin.
   */
  bytes join_token = 4;

  /*
   * Remaining time in seconds to send StoreForwardCatchUpJoin.
   */
  uint32 join_remaining_seconds = 5;
}

/*
 * Join a Catch-Up session after retuning to the S&F mesh.
 */
message StoreForwardCatchUpJoin {
  /*
   * Request identifier from StoreForwardCatchUpRequest.
   */
  bytes request_id = 1;

  /*
   * Admission epoch from the selected service binding.
   */
  fixed64 admission_epoch = 2;

  /*
   * Offer identifier from StoreForwardCatchUpReady.
   */
  uint32 offer_generation = 3;

  /*
   * Random, single-session capability from StoreForwardCatchUpReady.
   */
  bytes join_token = 4;
}

/*
 * Result code for a StoreForwardCatchUpJoin attempt.
 */
enum StoreForwardCatchUpJoinResultCode {
  /*
   * The result code was not set.
   */
  STORE_FORWARD_CATCH_UP_JOIN_RESULT_UNSPECIFIED = 0;

  /*
   * The session is active and may begin archive reconciliation.
   */
  STORE_FORWARD_CATCH_UP_JOIN_RESULT_ACCEPTED = 1;

  /*
   * The offered session is no longer valid.
   */
  STORE_FORWARD_CATCH_UP_JOIN_RESULT_REJECTED = 2;
}

/*
 * Result of a Catch-Up join attempt.
 */
message StoreForwardCatchUpJoinResult {
  /*
   * Request identifier from StoreForwardCatchUpRequest.
   */
  bytes request_id = 1;

  /*
   * Admission epoch from the selected service binding.
   */
  fixed64 admission_epoch = 2;

  /*
   * Offer identifier from StoreForwardCatchUpReady.
   */
  uint32 offer_generation = 3;

  /*
   * Whether the session became active.
   */
  StoreForwardCatchUpJoinResultCode result = 4;
}

/*
 * Reason a Catch-Up admission request was rejected.
 */
enum StoreForwardCatchUpRejectReason {
  /*
   * The reject reason was not set.
   */
  STORE_FORWARD_CATCH_UP_REJECT_UNSPECIFIED = 0;

  /*
   * The service is busy and did not retain a waiting reservation.
   */
  STORE_FORWARD_CATCH_UP_REJECT_BUSY = 1;

  /*
   * The bounded waiting queue has no available entry.
   */
  STORE_FORWARD_CATCH_UP_REJECT_QUEUE_FULL = 2;

  /*
   * The service does not currently provide Catch-Up.
   */
  STORE_FORWARD_CATCH_UP_REJECT_DISABLED = 3;

  /*
   * The requester is not allowed to access the requested scope.
   */
  STORE_FORWARD_CATCH_UP_REJECT_ACCESS_DENIED_OR_SCOPE_UNAVAILABLE = 4;
}

/*
 * A terminal Catch-Up admission response.
 */
message StoreForwardCatchUpReject {
  /*
   * Request identifier from StoreForwardCatchUpRequest.
   */
  bytes request_id = 1;

  /*
   * Admission epoch from the selected service binding.
   */
  fixed64 admission_epoch = 2;

  /*
   * Reason the request could not be admitted.
   */
  StoreForwardCatchUpRejectReason reason = 3;

  /*
   * Suggested retry delay in seconds, or zero when retry is not advised.
   */
  uint32 retry_after_seconds = 4;
}

/*
 * Cancel a Catch-Up request or session.
 */
message StoreForwardCatchUpCancel {
  /*
   * Request identifier from StoreForwardCatchUpRequest.
   */
  bytes request_id = 1;

  /*
   * Admission epoch from the selected service binding.
   */
  fixed64 admission_epoch = 2;
}
